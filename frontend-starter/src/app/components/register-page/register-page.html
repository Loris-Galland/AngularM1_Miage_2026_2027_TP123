<section class="card">
  <h1>Créer un compte</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Nom<input formControlName="name" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <small class="error">Le nom doit faire au moins 2 caractères</small>
      }
    </label>
    <label>
      Email<input type="email" formControlName="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="error">Email invalide</small>
      }
    </label>
    <label>
      Mot de passe<input type="password" formControlName="password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="error">Le mot de passe doit faire au moins 8 caractères</small>
      }
    </label>
    <button type="submit" [disabled]="form.invalid">Créer mon compte</button>
  </form>
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
  <p><a routerLink="/login">Déjà inscrit ?</a></p>
</section>
